name: Streamlit CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python -m py_compile app.py data.py research_2026.py pages/*.py

      - name: Data integrity check
        run: |
          python - <<'PY'
          import data
          import research_2026 as r

          assert len(data.MARKETS) == 100, f"Expected 100 markets, got {len(data.MARKETS)}"
          assert len(r.WORLD_50) == 50, f"Expected 50 World markets, got {len(r.WORLD_50)}"
          assert len(r.EUROPE_50) == 50, f"Expected 50 Europe markets, got {len(r.EUROPE_50)}"

          world_countries = [x[1] for x in r.WORLD_50]
          europe_countries = [x[1] for x in r.EUROPE_50]
          assert len(world_countries) == len(set(world_countries)), "Duplicate World 50 market names detected"
          assert len(europe_countries) == len(set(europe_countries)), "Duplicate Europe 50 market names detected"

          assert r.CASE_STUDY["markets"] == 50
          assert r.CASE_STUDY["emails_sent_min"] >= 5000
          assert r.CASE_STUDY["positive_replies"] == 10
          assert len(r.CASE_STUDY["products"]) == 5

          print("Data integrity OK")
          PY

      - name: Streamlit smoke test
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > /tmp/style-streamlit.log 2>&1 &
          APP_PID=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health | grep -qi ok; then
              echo "Streamlit health check OK"
              kill $APP_PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/style-streamlit.log
          kill $APP_PID || true
          exit 1
