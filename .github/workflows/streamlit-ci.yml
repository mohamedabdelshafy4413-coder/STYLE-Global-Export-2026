name: Streamlit CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python -m py_compile streamlit_app.py app.py data.py research_2026.py pages/*.py

      - name: Data integrity check
        run: |
          python - <<'PY'
          import data
          import research_2026 as r
          assert len(data.MARKETS) == 100
          assert len(r.WORLD_50) == 50
          assert len(r.EUROPE_50) == 50
          assert len({x[1] for x in r.WORLD_50}) == 50
          assert len({x[1] for x in r.EUROPE_50}) == 50
          assert r.CASE_STUDY["markets"] == 50
          assert r.CASE_STUDY["emails_sent_min"] >= 5000
          assert r.CASE_STUDY["positive_replies"] == 10
          assert len(r.CASE_STUDY["products"]) == 5
          print("Data integrity OK")
          PY

      - name: Streamlit Cloud entrypoint smoke test
        run: |
          streamlit run streamlit_app.py --server.headless true --server.port 8501 > /tmp/style-streamlit.log 2>&1 &
          APP_PID=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health | grep -qi ok; then
              curl -fsS http://127.0.0.1:8501/ >/dev/null
              echo "Streamlit entrypoint health check OK"
              kill $APP_PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/style-streamlit.log
          kill $APP_PID || true
          exit 1
